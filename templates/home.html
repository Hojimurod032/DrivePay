<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #ffffff;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 16px;
            color: #666;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .product-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 24px;
            background-color: #f9f9f9;
            transition: box-shadow 0.3s ease;
        }

        .product-card:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .product-name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #222;
        }

        .product-description {
            font-size: 14px;
            color: #666;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .product-price {
            font-size: 24px;
            font-weight: 700;
            color: #000;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #000;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #333;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 24px;
            }

            .container {
                padding: 30px 16px;
            }

            .products-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
        .header-link {
            display: inline-block;
            margin-top: 16px;
            padding: 10px 20px;
            background-color: #f0f0f0;
            color: #000;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #d0d0d0;
        }

        .header-link:hover {
            background-color: #e0e0e0;
            border-color: #999;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Products</h1>
        <p class="subtitle">Explore our selection</p>
        <a href="{% url 'search-order' %}" class="header-link">Find Your Order</a>
        <a href="/admin/" class="header-link">Admin Page</a>
    </header>

    <div class="products-grid">
        {% for i in item_data %}
            <div class="product-card">
                <div class="product-name">{{ i.name }}</div>
                <div class="product-description">{{ i.description }}</div>
                <div class="product-price">${{ i.price }}</div>
                <a href="{% url 'detail' i.id %}" class="btn">View Details</a>
            </div>
        {% endfor %}

    </div>
</div>
</body>
</html>
