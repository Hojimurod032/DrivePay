<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://js.stripe.com/v3/"></script>
    <title>Product Details</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #ffffff;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            font-size: 14px;
            color: #666;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            color: #000;
        }

        .detail-wrapper {
            background-color: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 40px;
        }

        .product-name {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #000;
        }

        .product-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            font-size: 14px;
            color: #666;
        }

        .product-description {
            font-size: 16px;
            color: #555;
            line-height: 1.8;
            margin-bottom: 30px;
            max-width: 600px;
        }

        .features-section {
            margin-bottom: 30px;
        }

        .features-title {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 12px;
        }

        .features-list {
            list-style: none;
            font-size: 14px;
            color: #555;
        }

        .features-list li {
            padding: 8px 0;
        }

        .features-list li:before {
            content: "✓ ";
            color: #000;
            font-weight: 700;
            margin-right: 8px;
        }

        .price-section {
            margin: 40px 0;
            padding: 24px 0;
            border-top: 1px solid #e0e0e0;
            border-bottom: 1px solid #e0e0e0;
        }

        .price-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .price {
            font-size: 48px;
            font-weight: 700;
            color: #000;
        }

        .btn-section {
            margin-top: 40px;
        }

        .btn {
            display: inline-block;
            padding: 16px 40px;
            background-color: #000;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #333;
        }

        @media (max-width: 768px) {
            .product-name {
                font-size: 28px;
            }

            .price {
                font-size: 36px;
            }

            .container {
                padding: 30px 16px;
            }

            .detail-wrapper {
                padding: 24px;
            }

            .product-meta {
                flex-direction: column;
                gap: 12px;
            }

            .btn {
                width: 100%;
                text-align: center;
                padding: 14px 24px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <a href="{% url 'home' %}" class="back-link">← Back to Products</a>

    <div class="detail-wrapper">
        <div class="product-name">{{ item_detail_data.name }}</div>
        <div class="product-meta">
            <span>Product ID: PRE-{{ item_detail_data.id }}</span>
            <span>Availability: In Stock</span>
        </div>

        <div class="product-description">
            {{ item_detail_data.description }}
        </div>


        <div class="price-section">
            <div class="price-label">Price</div>
            <div class="price">${{ item_detail_data.price }}</div>
        </div>

        <div class="btn-section">
            <button class="btn" id="buy-button">Buy Now</button>
        </div>
    </div>
</div>

<script>
    const stripe = Stripe("{{ stripe_public_key }}");

    const buyButton = document.getElementById("buy-button");

    buyButton.addEventListener("click", async () => {
        buyButton.disabled = true;
        buyButton.textContent = "Processing...";

        try {
            const response = await fetch(
                "{% url 'buy' item_detail_data.id %}"
            );

            const session = await response.json();

            const result = await stripe.redirectToCheckout({
                sessionId: session.id
            });

            if (result.error) {
                alert(result.error.message);
                buyButton.disabled = false;
                buyButton.textContent = "Buy Now";
            }

        } catch (error) {
            console.error(error);

            alert("Something went wrong.");
            buyButton.disabled = false;
            buyButton.textContent = "Buy Now";
        }
    });
</script>

</body>
</html>
